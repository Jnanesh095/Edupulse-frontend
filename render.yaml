services:
  - type: web
    runtime: static
    name: edupulse-frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        value: https://edupulse-api-gateway.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
